name: GitHub Open-Source Scraper (gosom + SerpAPI)

on:
  workflow_dispatch:
    inputs:
      engine:
        description: "Scraper Motoru"
        required: true
        type: choice
        default: "gosom"
        options:
          - gosom
          - serpapi
      query:
        description: "Tüm Antalya Arama Kelimesi (örn: Antalya kafe, Alanya butik otel, Kaş restoran)"
        required: true
        default: "Antalya kafe"
      depth:
        description: "Tarama Derinliği (1 = hızlı ~20 yer, 2 = orta ~40 yer, 3 = derin ~60 yer)"
        required: false
        default: "2"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run gosom/google-maps-scraper (v1.21.0 — 100% Free Open-Source)
        if: ${{ inputs.engine == 'gosom' }}
        env:
          SEARCH_QUERY: ${{ inputs.query }}
          SEARCH_DEPTH: ${{ inputs.depth }}
        run: |
          set -euo pipefail
          curl -fSL "https://github.com/gosom/google-maps-scraper/releases/download/v1.21.0/google_maps_scraper-1.21.0-linux-amd64" -o /tmp/gosom
          chmod +x /tmp/gosom
          printf '%s\n' "$SEARCH_QUERY" > /tmp/queries.txt

          # Run in -fast-mode (no browser needed, fast & zero API key) covering greater Antalya
          /tmp/gosom \
            -input /tmp/queries.txt \
            -results /tmp/gosom_out.jsonl \
            -json \
            -fast-mode \
            -lang tr \
            -geo "36.8969,30.7133" \
            -zoom 11 \
            -radius 45000 \
            -depth "${SEARCH_DEPTH:-2}" \
            -exit-on-inactivity 90s || true

          python3 - <<'PY'
          import json, os

          out_file = "/tmp/gosom_out.jsonl"
          raw_items = []
          if os.path.exists(out_file):
              with open(out_file, encoding="utf-8") as f:
                  for line in f:
                      line = line.strip()
                      if not line:
                          continue
                      try:
                          raw_items.append(json.loads(line))
                      except Exception:
                          pass

          path = "public/antalya-live-leads.json"
          existing = json.load(open(path, encoding="utf-8")) if os.path.exists(path) else []
          seen = {(x.get("title") or "").strip().lower() for x in existing}
          social = ("instagram.com", "facebook.com", "fb.com", "linktr.ee", "wa.me", "tiktok.com")
          query = os.environ.get("SEARCH_QUERY", "Antalya")

          added = 0
          for item in raw_items:
              site = (item.get("web_site") or item.get("website") or "").lower()
              has_real_site = bool(site) and not any(s in site for s in social)
              phone = (item.get("phone") or "").strip()
              title = (item.get("title") or "").strip()
              if has_real_site or not phone or not title or title.lower() in seen:
                  continue
              seen.add(title.lower())
              thumb = item.get("thumbnail") or ""
              if not thumb and isinstance(item.get("images"), list) and item["images"]:
                  first = item["images"][0]
                  if isinstance(first, dict):
                      thumb = first.get("image") or ""
              existing.insert(0, {
                  "title": title,
                  "categoryName": item.get("category") or query.replace("Antalya ", "").title(),
                  "phone": phone,
                  "totalScore": item.get("review_rating"),
                  "reviewsCount": item.get("review_count") or 0,
                  "address": item.get("address") or "",
                  "openingHours": item.get("open_hours") or "Her gün açık",
                  "imageUrl": thumb,
                  "description": item.get("descriptions") or "",
                  "highlights": (item.get("categories") or [])[:3],
                  "url": item.get("link") or "",
                  "source": "gosom/google-maps-scraper",
                  "query": query,
              })
              added += 1

          os.makedirs("public", exist_ok=True)
          with open(path, "w", encoding="utf-8") as f:
              json.dump(existing, f, ensure_ascii=False, indent=2)
          print(f"gosom '{query}': {len(raw_items)} tarandı, {added} yeni sitesiz & telefonlu işletme eklendi (Toplam: {len(existing)})")
          PY

      - name: Run SerpAPI Google Maps Scraper
        if: ${{ inputs.engine == 'serpapi' }}
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          SEARCH_QUERY: ${{ inputs.query }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request

          key = os.environ.get("SERPAPI_API_KEY", "").strip()
          query = os.environ.get("SEARCH_QUERY", "Antalya kafe").strip()
          if not key:
              raise SystemExit("SERPAPI_API_KEY secret tanımlı değil!")

          url = "https://serpapi.com/search.json?" + urllib.parse.urlencode({
              "engine": "google_maps",
              "q": query,
              "ll": "@36.8969,30.7133,11z",
              "hl": "tr",
              "gl": "tr",
              "api_key": key,
          })
          with urllib.request.urlopen(url, timeout=30) as resp:
              data = json.loads(resp.read().decode("utf-8"))

          path = "public/antalya-live-leads.json"
          existing = json.load(open(path, encoding="utf-8")) if os.path.exists(path) else []
          seen = {(x.get("title") or "").strip().lower() for x in existing}
          social = ("instagram.com", "facebook.com", "fb.com", "linktr.ee", "wa.me", "tiktok.com")

          added = 0
          for item in data.get("local_results", []):
              site = (item.get("website") or "").lower()
              has_real_site = bool(site) and not any(s in site for s in social)
              phone = (item.get("phone") or "").strip()
              title = (item.get("title") or "").strip()
              if has_real_site or not phone or not title or title.lower() in seen:
                  continue
              seen.add(title.lower())
              existing.insert(0, {
                  "title": title,
                  "categoryName": item.get("type") or query.replace("Antalya ", "").title(),
                  "phone": phone,
                  "totalScore": item.get("rating"),
                  "reviewsCount": item.get("reviews") or 0,
                  "address": item.get("address") or "",
                  "openingHours": item.get("open_state") or item.get("hours") or "Her gün açık",
                  "imageUrl": item.get("thumbnail") or "",
                  "description": item.get("description") or "",
                  "highlights": (item.get("types") or [])[:3],
                  "url": f"https://www.google.com/maps/place/?q=place_id:{item['place_id']}" if item.get("place_id") else "",
                  "source": "SerpAPI",
                  "query": query,
              })
              added += 1

          os.makedirs("public", exist_ok=True)
          with open(path, "w", encoding="utf-8") as f:
              json.dump(existing, f, ensure_ascii=False, indent=2)
          print(f"SerpAPI '{query}': {added} yeni işletme eklendi (Toplam: {len(existing)})")
          PY

      - name: Commit & Publish Updated Antalya Leads
        run: |
          git config user.name "LIKYA Scraper Bot"
          git config user.email "bot@likyastudios.live"
          git add public/antalya-live-leads.json
          git diff --staged --quiet || git commit -m "Scraper (${{ inputs.engine }}): ${{ inputs.query }}"
          git push
